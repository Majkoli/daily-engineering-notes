name: Daily Engineering Note

on:
  schedule:
    # Runs 3 times daily in GitHub's cloud:
    # - 08:00 UTC (10:00 CEST): Commit #1 (always runs if no commit today)
    # - 13:00 UTC (15:00 CEST): Commit #2 (runs if today's weighted random target is 2 or 3)
    # - 18:00 UTC (20:00 CEST): Commit #3 / Catch-up (ensures full daily random target of 1, 2, or 3 commits is met)
    - cron: '0 8 * * *'
    - cron: '0 13 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-note:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Generate and push daily commit(s) based on weighted random target (1-3/day)
        run: |
          chmod +x scripts/generate-daily-note.sh
          HOUR=$(date -u +"%H")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" -ge 17 ]; then
            ./scripts/generate-daily-note.sh catchup
          else
            ./scripts/generate-daily-note.sh step
          fi

          if [ -n "$(git log origin/main..HEAD --oneline)" ]; then
            git push origin main
          else
            echo "No new commits needed for this window."
          fi
